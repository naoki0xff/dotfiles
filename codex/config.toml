# General Options
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
personality = "friendly"
approval_policy = "never"
sandbox_mode = "workspace-write"
web_search = "cached"

# Plugins
[features]
hooks = true
plugins = true

[plugins."slack@openai-curated"]
enabled = true

[plugins."github@openai-curated"]
enabled = true
