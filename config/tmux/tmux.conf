### .tmux.conf

# ---prefix---  #
set -g prefix C-s
unbind C-b
# overall
set -sg escape-time 1
set -g base-index 1
setw -g pane-base-index 1
set-window-option -g mode-keys vi
set -g status-keys emacs
set -g history-limit 50000
## appearance
# init
set-option -g focus-events on
set-option -g default-terminal screen-256color
set -g terminal-overrides 'xterm:colors=256'
# named color
set-option -g @user-bg-grey "#3f4247"
set-option -g @user-fg-orange "#d75f00"
set-option -g @user-bg-orange "#d75f00"
set-option -g @user-fg-green "#00d700"
set-option -g @user-bg-green "#00d700"
# statusline
set-option -g status-interval 1
set-option -g status-left-length 20
set-option -g status-left "#[fg=#{@user-fg-orange},bg=#{@user-bg-grey}]#[fg=black,bg=#{@user-bg-orange}]#S#[fg=#{@user-fg-orange},bg=#{@user-bg-grey}]"
set-option -g status-style fg=white,bg="#{@user-bg-grey}"
set-option -gw window-status-separator ""
set-option -gw window-status-current-format "#[bg=#{@user-bg-grey},fg=#{@user-bg-green}]#[bg=#{@user-bg-green},fg=black]#I:#W#{?window_flags,#{window_flags}, }#[bg=#{@user-bg-grey},fg=#{@user-bg-green}]"
set-option -g status-right-length 60
set-option -g status-right "#[fg=#{@user-fg-orange},bg=#{@user-bg-grey}]#[fg=black,bg=#{@user-bg-orange}]#(/usr/bin/env bash $HOME/.config/tmux/plugins/kube-tmux/kube.tmux black black black)#[fg=#{@user-fg-orange},bg=#{@user-bg-grey}]"
# window
set-option -g renumber-windows on
# border
set -g pane-active-border-style fg="#{@user-fg-green}",bg="black"
# utilities
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded..."

## server/session/window/buffer interface
# info
bind i display-popup -h 80% -w 80% -E "tmux list-panes -a -F \
  '#{session_name}:#{window_name}.#{pane_index} #{?pane_active,(active) ,}#{?pane_dead,(dead) ,}[#{pane_width}x#{pane_height}] [history #{history_size}/#{history_limit}, #{history_bytes} bytes]' \
  | sed '/^$/d' | sed 's/: / /' | fzf --no-sort --reverse --preview-window down --preview 'tmux capture-pane -ept {1}' | cut -d' ' -f1 | xargs tmux switch-client -t"
# session
bind C-c new-session
bind . command-prompt -I "#S" "rename-session -- '%%'"
bind P switch-client -p
bind N switch-client -n
# window
bind w confirm-before kill-window
bind C-h swap-window -t -1
bind C-l swap-window -t +1

## pane
# split
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
# break
bind b break-pane
# move
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# resize
bind -r < resize-pane -L 3
bind -r > resize-pane -R 3
bind -r - resize-pane -D 3
bind -r + resize-pane -U 3
# kill
bind x kill-pane

# mouse
set -g mouse on

# clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind-key ] run-shell "pbpaste | tmux load-buffer - && tmux paste-buffer"

## plugins
if "test ! -d ~/.tmux/plugins/tpm" \
  "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'
set -g @plugin 'jonmosco/kube-tmux'
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
